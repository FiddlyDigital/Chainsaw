<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so the app can paint under a notch and pay for it
         back with env(safe-area-inset-*); `interactive-widget` so the on-screen
         keyboard shrinks the layout rather than scrolling the transport away. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Chainsaw</title>
    <meta
      name="description"
      content="A live pattern sequencer: Strudel live coding with LSDJ's phrase/chain/song structure and an Ableton-style scene grid."
    />
    <meta name="theme-color" content="#0c0e14" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Chainsaw is a live-coding sequencer and needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
