name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A second push to a branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Separate steps so a failure names itself in the checks list rather than
      # making someone read a log to find out what broke.
      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    # The end-to-end suite runs against the built app, in a real browser with a
    # real AudioContext: the service worker, the offline shell, and whether any
    # sound fails to resolve are all part of what is being checked.
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Only Chromium: the full set is most of a gigabyte of downloads for
      # tests that never open Firefox or WebKit.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm run test:e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Traces and screenshots from the failure, which is the only time
          # anyone wants them.
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
